<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#09090d">
<title>REDLINE — Your Space</title>
<style>
:root{--bg:#09090d;--panel:#121218;--red:#e11d48;--light:#fb7185;--text:#f4f4f5;--muted:#92929e;--border:#292932}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif}
button,input{font:inherit;border-radius:10px;padding:12px}
button{cursor:pointer;border:0;background:var(--red);color:white;font-weight:700}
button:disabled{opacity:.55;cursor:wait}
button.secondary{background:#24242d;border:1px solid var(--border)}
input{width:100%;background:#0c0c11;color:white;border:1px solid var(--border);outline:none}
input:focus{border-color:var(--red)}
header{display:flex;align-items:center;justify-content:space-between;padding:17px;border-bottom:1px solid var(--border)}
.logo{font-size:24px;font-weight:900;letter-spacing:2px}.logo span{color:var(--red)}
small,.muted{color:var(--muted)}
#auth{max-width:400px;margin:45px auto;padding:20px}#auth h1{font-size:38px;margin-bottom:5px}#auth input{margin:7px 0}
#app{display:none}.layout{display:grid;grid-template-columns:300px 1fr;height:calc(100dvh - 67px)}
.sidebar{border-right:1px solid var(--border);overflow-y:auto;padding:15px}
.actions{display:flex;gap:8px;margin:12px 0}.actions button{flex:1;font-size:12px;padding:11px 5px}
#people{margin-top:15px}.person{padding:13px 10px;border-radius:12px;cursor:pointer;display:flex;gap:10px;align-items:center;margin:4px 0}
.person:hover,.person.active{background:#25121a}.avatar{width:42px;height:42px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;background:#3a1422;color:var(--light);font-weight:800}
.person-info{min-width:0;flex:1}.person-info strong,.person-info small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.person-info small{margin-top:4px}
#chat{display:flex;flex-direction:column;min-width:0}#chatHeader{padding:14px 17px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
#chatHeader strong{flex:1;overflow:hidden;text-overflow:ellipsis}#messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.bubble{max-width:85%;width:fit-content;padding:11px 14px;border-radius:15px;background:#202028;overflow-wrap:anywhere}.bubble.mine{background:#8e1535;align-self:flex-end}
.bubble small{display:block;margin-top:5px;font-size:10px}#sendForm{display:flex;gap:8px;padding:12px;border-top:1px solid var(--border)}
#sendForm input{flex:1;min-width:0}#sendForm button{padding:10px 18px}#empty{margin:auto;text-align:center;padding:25px}#empty .symbol{font-size:55px;color:var(--red)}
.hidden{display:none!important}#authStatus{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}
@media(max-width:650px){.layout{grid-template-columns:1fr}.sidebar{border-right:0}#chat{display:none}body.chat-open .sidebar{display:none}body.chat-open #chat{display:flex;height:calc(100dvh - 67px)}#auth{margin:25px auto}}
</style>
</head>
<body>
<header><div class="logo">RED<span>LINE</span></div><button id="logout" class="secondary hidden">Log out</button></header>
<section id="auth">
<h1>Enter your<br><span style="color:#e11d48">own space.</span></h1>
<p class="muted">Your squad. Your rules. No phone number.</p>
<input id="email" type="email" placeholder="Email address" autocomplete="email">
<input id="password" type="password" placeholder="Password (at least 6 characters)" autocomplete="current-password">
<div id="signupFields" class="hidden">
<input id="username" placeholder="Choose ID (e.g. ACE_27)" maxlength="24" autocomplete="username">
<input id="displayName" placeholder="Your display name" maxlength="40">
</div>
<button id="login" style="width:100%;margin-top:10px">Log in</button>
<button id="signup" class="secondary" style="width:100%;margin-top:8px">Create account</button>
<p id="authStatus" class="muted" role="status"></p>
</section>
<section id="app"><div class="layout">
<aside class="sidebar"><strong>Your squad</strong><div class="actions"><button id="addContact">+ Contact</button><button id="createGroup" class="secondary">+ Group</button></div>
<input id="search" placeholder="Search your chats..."><div id="people"></div>
<p class="muted" style="font-size:11px">Your saved nicknames are private to your account.</p></aside>
<main id="chat">
<div id="empty"><div class="symbol">✦</div><h2>Your people. Your space.</h2><p class="muted">Choose a contact or create a group.</p></div>
<div id="conversation" class="hidden" style="display:flex;flex-direction:column;flex:1;min-height:0">
<div id="chatHeader"><button id="back" class="secondary hidden">← Back</button><strong id="chatTitle">Chat</strong><button id="rename" class="secondary">Rename</button></div>
<div id="messages"></div><form id="sendForm"><input id="messageInput" placeholder="Message your Bois..." maxlength="4000" autocomplete="off" required><button id="sendButton" type="submit">Send</button></form>
</div></main></div></section>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,addDoc,collection,query,where,orderBy,onSnapshot,serverTimestamp,updateDoc,runTransaction} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyB-3EDn9LF4VPUI-ZspyDk4KHSp0PktEVw",
 authDomain:"redline-chat-7d258.firebaseapp.com",
 projectId:"redline-chat-7d258",
 storageBucket:"redline-chat-7d258.firebasestorage.app",
 messagingSenderId:"799281869222",
 appId:"1:799281869222:web:c61087e7661d32008d9f67",
 measurementId:"G-2XNZHNZEF1"
};
const firebaseApp=initializeApp(firebaseConfig),auth=getAuth(firebaseApp),db=getFirestore(firebaseApp);
const $=id=>document.getElementById(id);
let me=null,profile=null,active=null,contacts=[],groups=[],knownUsers=[];
let stopMessages=null,stopContacts=null,stopGroups=null,stopUsers=null,isSignup=false,registrationInProgress=false,repairMode=false;

function status(s){$("authStatus").textContent=s}
function cleanId(s){return s.trim().replace(/^@/,"").toUpperCase()}
function directChatId(a,b){return [a,b].sort().join("_")}
function labelContact(c){return c.nickname||c.displayName||c.username||"Friend"}
function stopAll(){stopMessages?.();stopContacts?.();stopGroups?.();stopUsers?.();stopMessages=stopContacts=stopGroups=stopUsers=null}
function friendlyError(e){
 const code=e?.code||"";
 if(code==="auth/email-already-in-use")return "That email already has an account. Try logging in.";
 if(code==="auth/invalid-email")return "Enter a valid email address.";
 if(code==="auth/weak-password")return "Choose a password with at least 6 characters.";
 if(code==="auth/invalid-credential"||code==="auth/wrong-password"||code==="auth/user-not-found")return "Email or password is incorrect.";
 if(code==="permission-denied"||code==="firestore/permission-denied")return "Firestore denied this action. Check the published Firestore rules. (permission-denied)";
 if(code==="auth/network-request-failed")return "Network request failed. Check your internet connection and try again.";
 return e?.message||"Something went wrong. Please try again.";
}
function report(e){console.error(e);alert(friendlyError(e))}
function showAuth(){
 $("auth").style.display="block";$("app").style.display="none";$("logout").classList.add("hidden");
 document.body.classList.remove("chat-open");
}
$("signup").onclick=async()=>{
 if(!isSignup){isSignup=true;$("signupFields").classList.remove("hidden");$("login").classList.add("hidden");$("signup").textContent="Register";status("");return}
 const email=$("email").value.trim(),password=$("password").value,username=cleanId($("username").value),displayName=$("displayName").value.trim();
 if(!repairMode&&!email){status("Enter your email address.");return}
 if(!repairMode&&password.length<6){status("Password must contain at least 6 characters.");return}
 if(!/^[A-Z0-9_]{3,24}$/.test(username)){status("ID must be 3–24 letters, numbers or underscores.");return}
 if(!displayName){status("Enter your display name.");return}
 $("signup").disabled=true;
 let credential=null;
 try{
  if(!repairMode){
   registrationInProgress=true;
   credential=await createUserWithEmailAndPassword(auth,email,password);
  }
  const user=repairMode?auth.currentUser:credential.user;
  if(!user)throw new Error("No signed-in account was found. Please log in again.");
  await runTransaction(db,async tx=>{
   const nameRef=doc(db,"usernames",username),userRef=doc(db,"users",user.uid);
   const existing=await tx.get(nameRef);
   const existingProfile=await tx.get(userRef);
   if(existing.exists()&&existing.data().uid!==user.uid)throw new Error("That REDLINE ID is already taken. Choose another ID.");
   if(existingProfile.exists())throw new Error("Your profile already exists. Log out and log in again.");
   if(!existing.exists())tx.set(nameRef,{uid:user.uid,username});
   tx.set(userRef,{username,displayName,createdAt:serverTimestamp()});
  });
  repairMode=false;registrationInProgress=false;isSignup=false;
  $("signupFields").classList.add("hidden");$("login").classList.remove("hidden");$("signup").textContent="Create account";
  status("Profile saved. Loading REDLINE…");
  await handleAuthenticatedUser(user);
 }catch(e){
  registrationInProgress=false;
  console.error("Signup/profile setup failed:",e);
  status("Could not finish registration: "+friendlyError(e)+(e?.code?" ["+e.code+"]":""));
  if(!repairMode&&auth.currentUser){repairMode=true;isSignup=true;$("signupFields").classList.remove("hidden");$("login").classList.add("hidden");$("signup").textContent="Create profile";status("Your authentication account exists, but profile setup failed. Choose an available ID and display name, then tap Create profile. Details: "+friendlyError(e));}
 }
 finally{$("signup").disabled=false}
};
$("login").onclick=async()=>{
 const email=$("email").value.trim(),password=$("password").value;
 if(!email||!password){status("Enter your email and password.");return}
 $("login").disabled=true;
 try{await signInWithEmailAndPassword(auth,email,password);status("")}
 catch(e){status(friendlyError(e))}
 finally{$("login").disabled=false}
};
$("logout").onclick=async()=>{stopAll();active=null;await signOut(auth);showAuth()};
async function handleAuthenticatedUser(user){
 stopAll();me=user;profile=null;active=null;
 if(!user){showAuth();return}
 try{
  const snap=await getDoc(doc(db,"users",user.uid));
  if(!snap.exists()){
   repairMode=true;isSignup=true;showAuth();
   $("signupFields").classList.remove("hidden");$("login").classList.add("hidden");$("signup").textContent="Create profile";
   status("Your Firebase login exists, but its REDLINE profile is missing. Enter a new available ID and display name, then tap Create profile. Your account will not be deleted.");
   return;
  }
  repairMode=false;profile=snap.data();$("auth").style.display="none";$("app").style.display="block";$("logout").classList.remove("hidden");
  startLists();
 }catch(e){status("Could not load profile: "+friendlyError(e)+(e?.code?" ["+e.code+"]":""));console.error("Profile load failed:",e)}
}
onAuthStateChanged(auth,async user=>{
 if(registrationInProgress)return;
 await handleAuthenticatedUser(user);
});
function startLists(){
 stopContacts=onSnapshot(collection(db,"users",me.uid,"contacts"),s=>{contacts=s.docs.map(d=>({id:d.id,...d.data()}));drawPeople()},report);
 stopGroups=onSnapshot(query(collection(db,"chats"),where("members","array-contains",me.uid)),s=>{groups=s.docs.filter(d=>d.data().type==="group").map(d=>({id:d.id,...d.data()}));drawPeople()},report);
 stopUsers=onSnapshot(collection(db,"users"),s=>{knownUsers=s.docs.map(d=>({uid:d.id,...d.data()}))},e=>console.warn("User directory:",e));
}
function drawPeople(){
 const term=$("search").value.toLowerCase(),list=$("people");list.replaceChildren();
 const entries=[
  ...contacts.map(c=>({kind:"contact",data:c,title:labelContact(c),subtitle:"@"+(c.username||"unknown")})),
  ...groups.map(g=>({kind:"group",data:g,title:g.name||"Group",subtitle:(g.members?.length||0)+" members"}))
 ].filter(x=>(x.title+" "+x.subtitle).toLowerCase().includes(term));
 if(!entries.length){const p=document.createElement("p");p.className="muted";p.textContent="No chats yet. Add your Bois!";list.append(p)}
 entries.forEach(entry=>{
  const el=document.createElement("div");el.className="person"+(active?.id===(entry.kind==="group"?entry.data.id:entry.data.chatId)?" active":"");
  const av=document.createElement("div");av.className="avatar";av.textContent=(entry.title[0]||"R").toUpperCase();
  const info=document.createElement("div");info.className="person-info";
  const strong=document.createElement("strong");strong.textContent=entry.title;
  const small=document.createElement("small");small.textContent=entry.subtitle;
  info.append(strong,small);el.append(av,info);el.onclick=()=>openChat(entry);list.append(el);
 });
}
$("search").oninput=drawPeople;
$("addContact").onclick=async()=>{
 const id=cleanId(prompt("Enter your friend's REDLINE ID:")||"");if(!id)return;
 if(id===profile?.username){alert("That's your own ID.");return}
 try{
  const nameSnap=await getDoc(doc(db,"usernames",id));
  if(!nameSnap.exists()){alert("ID not found. Check the spelling.");return}
  const friendUid=nameSnap.data().uid,friendSnap=await getDoc(doc(db,"users",friendUid));
  if(!friendSnap.exists()){alert("That user profile is unavailable.");return}
  const p=friendSnap.data(),cid=directChatId(me.uid,friendUid),chatRef=doc(db,"chats",cid);
  const existing=await getDoc(chatRef);
  if(!existing.exists())await setDoc(chatRef,{type:"direct",members:[me.uid,friendUid],createdBy:me.uid,createdAt:serverTimestamp()});
  await setDoc(doc(db,"users",me.uid,"contacts",friendUid),{friendUid,username:p.username,displayName:p.displayName,chatId:cid},{merge:true});
  alert("Contact added!");
 }catch(e){report(e)}
};
$("createGroup").onclick=async()=>{
 const name=prompt("Group name:");if(!name?.trim())return;
 const raw=prompt("Enter members' REDLINE IDs separated by commas (not including yourself):");if(raw===null)return;
 try{
  const members=new Set([me.uid]);
  for(const id of raw.split(",").map(cleanId).filter(Boolean)){
   const snap=await getDoc(doc(db,"usernames",id));
   if(snap.exists())members.add(snap.data().uid);else alert("Could not find ID: "+id);
  }
  const memberArray=[...members];
  const ref=await addDoc(collection(db,"chats"),{type:"group",name:name.trim().slice(0,60),members:memberArray,createdBy:me.uid,createdAt:serverTimestamp()});
  await openChat({kind:"group",data:{id:ref.id,name:name.trim(),members:memberArray}});
 }catch(e){report(e)}
};
async function openChat(entry){
 const d=entry.data,isGroup=entry.kind==="group",id=isGroup?d.id:d.chatId;
 if(!id){alert("This chat is missing its chat ID.");return}
 active={id,kind:entry.kind,data:d};
 $("empty").classList.add("hidden");$("conversation").classList.remove("hidden");
 $("chatTitle").textContent=isGroup?(d.name||"Group"):labelContact(d);
 $("rename").classList.toggle("hidden",isGroup);
 $("messages").replaceChildren();document.body.classList.add("chat-open");
 $("back").classList.toggle("hidden",window.innerWidth>650);
 stopMessages?.();
 stopMessages=onSnapshot(query(collection(db,"chats",id,"messages"),orderBy("createdAt","asc")),snap=>{
  const box=$("messages");box.replaceChildren();
  snap.docs.forEach(m=>{
   const x=m.data(),bubble=document.createElement("div");bubble.className="bubble"+(x.senderId===me.uid?" mine":"");
   const author=document.createElement("div");author.style.fontSize="11px";author.style.color="#fda4af";
   author.textContent=x.senderId===me.uid?"You":(knownUsers.find(u=>u.uid===x.senderId)?.displayName||"Member");
   const body=document.createElement("div");body.textContent=x.text||"";
   const time=document.createElement("small");time.textContent=x.createdAt?.toDate?x.createdAt.toDate().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}):"Sending…";
   bubble.append(author,body,time);box.append(bubble);
  });
  box.scrollTop=box.scrollHeight;
 },report);
 drawPeople();
}
$("back").onclick=()=>{document.body.classList.remove("chat-open");active=null;stopMessages?.();stopMessages=null};
$("rename").onclick=async()=>{
 if(active?.kind!=="contact")return;
 const name=prompt("Choose a private nickname:",labelContact(active.data));if(name===null)return;
 try{
  await setDoc(doc(db,"users",me.uid,"contacts",active.data.friendUid),{nickname:name.trim().slice(0,40)},{merge:true});
  active.data.nickname=name.trim().slice(0,40);$("chatTitle").textContent=labelContact(active.data);drawPeople();
 }catch(e){report(e)}
};
$("sendForm").onsubmit=async e=>{
 e.preventDefault();const text=$("messageInput").value.trim();if(!text||!active||!me)return;
 const chatIdNow=active.id;$("messageInput").value="";$("sendButton").disabled=true;
 try{await addDoc(collection(db,"chats",chatIdNow,"messages"),{text,senderId:me.uid,createdAt:serverTimestamp()})}
 catch(err){$("messageInput").value=text;report(err)}
 finally{$("sendButton").disabled=false}
};
window.addEventListener("resize",()=>{if(window.innerWidth>650)document.body.classList.remove("chat-open")});
</script>
</body>
</html>
